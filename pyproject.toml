[project]
name = "graphify-agent"
version = "0.1.0"
description = "网络信息采集 → 知识图谱（Neo4j）→ 图形化/自然语言查询的服务端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",
    "neo4j>=5.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "datasketch>=1.6",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "loguru>=0.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "testcontainers[neo4j]>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: 需要 Docker（Neo4j testcontainers）"]

[tool.coverage.run]
source = ["graphify"]
omit = ["tests/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "responses>=0.26.1",
    "testcontainers[neo4j]>=4.14.2",
]
